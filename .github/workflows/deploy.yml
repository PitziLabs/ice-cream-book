# .github/workflows/deploy.yml
#
# Build & Deploy: Ice Cream Cookbook → ECR → ECS Fargate (icecreamtofightwith.com)
#
# Thin caller for the shared site-deploy reusable workflow. The full pipeline
# (Astro build, Trivy scan, build-provenance attestation, ECS roll) lives in:
#   lentago/shared-workflows/.github/workflows/site-deploy.yml @ v1.1.1
#
# Pinned to v1.1.1, not v1.1.0 — v1.1.0 carried a job-level concurrency group
# that deadlocks against this repo's workflow-level `deploy-main` group.
# Fixed upstream in shared-workflows#51 / released as v1.1.1.
#
# This repo needs one extra step the reusable doesn't do by default: syncing
# recipes/*.md into the Astro content collection before the build. That's
# passed through via pre_build_command.

name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Serialize deploys. Multiple PRs merged in quick succession would
# otherwise produce parallel runs racing each other for the :latest
# tag on ECR — last push wins, intermediate runs are wasted, and
# the final live image is non-deterministic. cancel-in-progress
# means the most recent push always wins cleanly.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      id-token: write      # OIDC — AWS auth + attestation signing
      contents: read
      attestations: write  # store build provenance in GitHub's attestation store
      packages: read       # required by actions/attest-build-provenance
    uses: lentago/shared-workflows/.github/workflows/site-deploy.yml@v1.2.2
    with:
      ecr_repo: solidago-dev-app
      ecs_cluster: solidago-dev-cluster
      ecs_service: solidago-dev-app
      role_arn: arn:aws:iam::365184644049:role/solidago-dev-github-actions
      aws_region: us-east-1
      node_version: "22"
      pre_build_command: "python3 sync_recipes.py"
