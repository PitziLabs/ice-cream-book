# ============================================================================
# release.yml — tag-driven attested cookbook PDF release
# ============================================================================
# Triggered by a semver tag (v1.2.3). Compiles the book markdown, converts to
# PDF via pandoc + xelatex (Unicode-safe), generates a SHA-256 checksum,
# attests the artifact via actions/attest-build-provenance (SLSA Build L2 —
# the build definition lives in this repo, so L3's "hosted outside the
# requester's control" property does not apply here; contrast deploy.yml,
# whose image builds run in the shared reusable and do reach L3), then
# publishes a GitHub Release with the PDF and checksum attached.
#
# Required permissions (workflow-level):
#   id-token: write      — OIDC for Sigstore attestation signing
#   contents: write      — create GitHub releases and upload assets
#   attestations: write  — store build provenance in GitHub's attestation store
#   packages: read       — required by actions/attest-build-provenance
#
# Verify after a release:
#   gh attestation verify Ice_Cream_to_Fight_With_vX.Y.Z.pdf --owner lentago
# ============================================================================

name: Release cookbook PDF

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  id-token: write
  contents: write
  attestations: write
  packages: read

jobs:
  release:
    name: Build attested PDF and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Compile book
        run: python compile_book.py

      - name: Install PDF toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-latex-extra \
            lmodern \
            fonts-noto

      - name: Convert to PDF
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pandoc Ice_Cream_to_Fight_With_COMPLETE.md \
            --pdf-engine=xelatex \
            --resource-path=. \
            -V mainfont="Noto Serif" \
            -V monofont="Noto Mono" \
            -V geometry:margin=1in \
            -o "Ice_Cream_to_Fight_With_${TAG}.pdf"

      - name: Generate SHA-256 checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum "Ice_Cream_to_Fight_With_${TAG}.pdf" \
            > "Ice_Cream_to_Fight_With_${TAG}.pdf.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: Ice_Cream_to_Fight_With_${{ github.ref_name }}.pdf

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > /tmp/release-notes.md <<EOF
          Versioned PDF of the complete 28-recipe manuscript, compiled from source markdown.

          Build provenance is attested via GitHub's Sigstore-backed store.
          Verify after downloading:

              gh attestation verify "Ice_Cream_to_Fight_With_${TAG}.pdf" --owner lentago

          SHA-256 checksum: \`Ice_Cream_to_Fight_With_${TAG}.pdf.sha256\`
          EOF
          gh release create "$TAG" \
            --title "Ice Cream to Fight With ${TAG}" \
            --notes-file /tmp/release-notes.md \
            "Ice_Cream_to_Fight_With_${TAG}.pdf" \
            "Ice_Cream_to_Fight_With_${TAG}.pdf.sha256"
