name: Accessibility smoke test

# Deliberately no `paths:` filter — this workflow must trigger on every PR
# so it always reports a conclusion. A required check that never fires on
# some PRs gets stuck "Expected" forever and deadlocks the merge. This
# check is NOT marked required (yet); required-check config is
# settings-as-code owned by lentago/.github, a separate change.
on:
  pull_request

permissions:
  contents: read

# `.tier-chip` and the numbered `.step` badges are scoped out via hideElements in
# pa11yci.config.json: they fail WCAG 1.4.3 as light-on-accent background fills for
# three tiers, and no text-color change fixes it — the accent swatches themselves
# have to darken, which is a design decision tracked in #158. Everything else on
# both pages is still checked, so this is a ratchet against new regressions, not a
# sign-off on that one. Removing those two selectors is #158's acceptance criterion.

jobs:
  a11y:
    name: pa11y accessibility smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci

      - name: Sync recipe content collection
        run: python sync_recipes.py

      - name: Build site
        run: npm run build

      - name: Start preview server
        run: |
          npx astro preview --host 127.0.0.1 --port 4321 &
          echo $! > /tmp/preview.pid

      - name: Wait for preview server
        run: npx wait-on http://127.0.0.1:4321 --timeout 30000

      - name: Run pa11y against homepage and a recipe page
        run: npm run test:a11y

      - name: Stop preview server
        if: always()
        run: kill "$(cat /tmp/preview.pid)" 2>/dev/null || true
