name: Lint content

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Run linter unit tests
        run: python -m unittest discover tests

      - name: Lint content
        id: lint
        continue-on-error: true
        run: python ice_cream_linter.py --format markdown > lint-report.md

      - name: Post lint report as PR comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: ice-cream-linter
          path: lint-report.md

      - name: Fail if lint reported errors
        if: steps.lint.outcome == 'failure'
        run: |
          echo "Linter reported errors — see the PR comment for details."
          exit 1
