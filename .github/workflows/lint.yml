name: Lint content

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Run linter unit tests
        run: python -m unittest discover tests

      - name: Lint content
        id: lint
        continue-on-error: true
        run: python ice_cream_linter.py --format markdown > lint-report.md

      - name: Post lint report as PR comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: ice-cream-linter
          path: lint-report.md

      - name: Fail if lint reported errors
        if: steps.lint.outcome == 'failure'
        run: |
          echo "Linter reported errors — see the PR comment for details."
          exit 1
