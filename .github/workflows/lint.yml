name: Lint content

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Run linter unit tests
        run: python -m unittest discover tests

      - name: Lint content
        id: lint
        continue-on-error: true
        run: python ice_cream_linter.py --format markdown > lint-report.md

      - name: Post lint report as PR comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: ice-cream-linter
          path: lint-report.md

      - name: Fail if lint reported errors
        if: steps.lint.outcome == 'failure'
        run: |
          echo "Linter reported errors — see the PR comment for details."
          exit 1
