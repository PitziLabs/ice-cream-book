name: Lint content

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Run linter unit tests
        run: python -m unittest discover tests

      - name: Lint content
        id: lint
        continue-on-error: true
        run: python ice_cream_linter.py --format markdown > lint-report.md

      - name: Post lint report as PR comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: ice-cream-linter
          path: lint-report.md

      - name: Fail if lint reported errors
        if: steps.lint.outcome == 'failure'
        run: |
          echo "Linter reported errors — see the PR comment for details."
          exit 1
