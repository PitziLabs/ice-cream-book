version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Two groups per ecosystem: -routine collapses weekly patch/minor churn into
    # one reviewable-on-green-checks PR; -major isolates breaking changes so they
    # get read deliberately. One giant group would hide a major bump inside patches;
    # no grouping at all produces a 28-PR flood (see lentago/.github#114).
    groups:
      actions-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Two groups per ecosystem: -routine collapses weekly patch/minor churn into
    # one reviewable-on-green-checks PR; -major isolates breaking changes so they
    # get read deliberately. One giant group would hide a major bump inside patches;
    # no grouping at all produces a 28-PR flood (see lentago/.github#114).
    groups:
      # astro-stack must be declared FIRST so it matches before npm-routine.
      # Reason: @astrojs/* packages are pre-1.0, so semver breaking changes land
      # in the MINOR position — Dependabot labels them "minor" and they fall into
      # npm-routine, which then fails npm ci with an unresolvable peer conflict
      # (e.g. @astrojs/starlight@0.41.7 requires peer astro@^7 while this repo
      # runs astro 5). All astro-stack packages are version-locked to each other,
      # so they must move as one unit regardless of semver label. No update-types
      # filter — the whole point is to catch every bump, including minors.
      astro-stack:
        applies-to: version-updates
        patterns:
          - "astro"
          - "@astrojs/*"
      npm-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]

  # The Dockerfile pins its nginx base by digest (supply-chain integrity), which
  # also freezes it — without this ecosystem, base-image security patches would
  # never arrive. Dependabot proposes digest bumps as reviewable PRs instead.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Two groups per ecosystem: -routine collapses weekly patch/minor churn into
    # one reviewable-on-green-checks PR; -major isolates breaking changes so they
    # get read deliberately. One giant group would hide a major bump inside patches;
    # no grouping at all produces a 28-PR flood (see lentago/.github#114).
    groups:
      docker-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
