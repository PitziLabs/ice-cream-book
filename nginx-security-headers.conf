# Shared security-header set, `include`d from the server scope AND repeated
# inside every location block that declares its own add_header — nginx does
# NOT inherit add_header into a child scope that sets one of its own, so a
# location with a single add_header silently drops everything set above it.
# `include`ing this file re-adds the full set instead of relying on each
# location to remember to repeat it by hand.
#
# server_tokens is a normal (non add_header) directive and inherits fine, so
# it only needs to appear once per server{} block — declaring it again inside
# a location here is harmless (same value), not required.
server_tokens off;

# X-Frame-Options is DENY, not SAMEORIGIN: this site never frames its own
# content (no iframe anywhere in src/ or the built dist/) — DENY is the
# stricter default when there's nothing to allow. frame-ancestors 'none' in
# the CSP below mirrors this.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Report-Only, not enforcing: this is a live public site and an enforcing
# policy written without observing real traffic risks breaking something.
# Drafted from what `npm run build`'s dist/ actually loads: a Google Fonts
# stylesheet (style-src) whose @font-face rules pull the actual font files
# from fonts.gstatic.com (font-src), Astro's scoped <style> blocks and a few
# inline style="" attributes (style-src 'unsafe-inline'), and one inlined
# <script type="module"> for scroll-linked pager auto-advance (script-src
# 'unsafe-inline' — no nonce infra yet). No data: URIs, no iframes, no
# client-side fetch/XHR anywhere in the built output, so img-src, connect-src,
# and frame-ancestors stay locked to 'self' / 'none'.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self'; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;
