server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    # NOTE: nginx add_header does NOT inherit into location blocks that set
    # their own add_header — nginx-security-headers.conf is re-`include`d in
    # those blocks below.
    include /etc/nginx/nginx-security-headers.conf;

    # Clean URLs — Astro generates /recipes/01_coconut_pandan/index.html
    # This serves that index.html when the URL has no trailing slash
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Health check endpoint for ALB target group
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
        include /etc/nginx/nginx-security-headers.conf;
    }

    # Cache static assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/nginx-security-headers.conf;
    }

    # Gzip
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1000;
}
